# The Network Decentralization Authority's register. See README.md for setup.
name = "nda-register"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Served at register.createfc.org (Cloudflare adds the DNS record and certificate on deploy),
# not on the account's shared workers.dev subdomain.
routes = [{ pattern = "register.createfc.org", custom_domain = true }]
workers_dev = false

# Font files are bundled as raw bytes; resvg's .wasm is compiled by wrangler.
[[rules]]
type = "Data"
globs = ["**/*.ttf"]
fallthrough = true

[vars]
# Pages allowed to send NDA Form 1. Add the local dev server you use for the microsite.
ALLOWED_ORIGINS = "https://createfc.org,https://eucalyptus-viminalis.github.io,http://localhost:5173,http://127.0.0.1:5173"
SITE_URL = "https://createfc.org/"

[[d1_databases]]
binding = "DB"
database_name = "nda-register"
# Made by `pnpm wrangler d1 create nda-register`. Local dev uses its own database in .wrangler/.
database_id = "55381e1e-7cfa-4f85-9beb-3e7a7a4beb3b"
