<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1200">
  <title>create-fc social preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    /* Same palette as the microsite: Tangerine's ink and greys, Farcaster purple. */
    :root {
      --safe: 56px;
      --bg: #282b29;          /* --tg-ink, the site's terminal surface */
      --panel: #1f2220;
      --text: #f4f4f4;        /* --tg-page */
      --muted: #a9b0aa;
      --accent: #8a63d2;      /* Farcaster logo purple, the site's mark */
      --accent-2: #b3a3ff;    /* the site's terminal prompt */
    }

    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
      font-family: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      position: relative;
    }

    .bg-effects { position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .glow {
      position: absolute; width: 900px; height: 700px; right: -260px; top: -160px;
      background: radial-gradient(closest-side, rgb(138 99 210 / 0.28), transparent 70%);
    }

    .safe {
      position: absolute; inset: 0; padding: var(--safe); z-index: 1;
      display: grid; grid-template-columns: 1fr 470px; gap: 48px; align-items: center;
    }

    .brand { display: flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 600; letter-spacing: -0.02em; }
    .mark {
      width: 44px; height: 44px; border-radius: 50%;
      background: repeating-conic-gradient(from -54deg, var(--accent) 0 108deg, transparent 108deg 120deg);
      -webkit-mask: radial-gradient(circle, transparent 0 15%, #000 16% 100%);
              mask: radial-gradient(circle, transparent 0 15%, #000 16% 100%);
    }

    .headline {
      margin-top: 44px;
      font-size: 80px; font-weight: 500; line-height: 0.98; letter-spacing: -0.05em;
    }
    .subtitle { margin-top: 26px; font-size: 30px; line-height: 1.3; color: var(--muted); max-width: 560px; }
    .subtitle b { color: var(--text); font-weight: 500; }

    .term {
      background: var(--panel);
      border: 1px solid rgb(255 255 255 / 0.08);
      border-radius: 20px;
      padding: 22px 26px 30px;
      box-shadow: 0 30px 80px rgb(0 0 0 / 0.35);
    }
    .dots { display: flex; gap: 9px; margin-bottom: 22px; }
    .dots i { width: 13px; height: 13px; border-radius: 50%; background: var(--muted); opacity: 0.4; }
    .line { display: flex; align-items: baseline; gap: 18px; padding: 15px 0; border-top: 1px solid rgb(255 255 255 / 0.07); }
    .dots + .line { border-top: 0; }
    .n { font-size: 34px; font-weight: 500; color: var(--accent-2); width: 24px; }
    .cmd { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 25px; color: var(--text); }
    .what { display: block; margin-top: 4px; font-family: "DM Sans", sans-serif; font-size: 24px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="bg-effects"><div class="glow"></div></div>

  <div class="safe">
    <div>
      <div class="brand"><span class="mark"></span>create-fc</div>
      <h1 class="headline">Your own Farcaster.<br>Three commands.</h1>
      <p class="subtitle">A read node and a client you run yourself. <b>No API keys.</b></p>
    </div>

    <div class="term">
      <div class="dots"><i></i><i></i><i></i></div>
      <div class="line"><span class="n">0</span><span class="cmd">hetzner.sh<span class="what">rent a server</span></span></div>
      <div class="line"><span class="n">1</span><span class="cmd">setup.sh<span class="what">sync a Snapchain node</span></span></div>
      <div class="line"><span class="n">2</span><span class="cmd">install.sh<span class="what">post through it</span></span></div>
    </div>
  </div>
</body>
</html>
