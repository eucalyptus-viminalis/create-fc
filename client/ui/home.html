<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="fameboy-token" content="__FAMEBOY_TOKEN__" />
  <meta name="referrer" content="no-referrer" />
  <title>fameboy</title>
  <link rel="icon" href="/fameboy.svg" type="image/svg+xml" />
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=VT323&display=swap" />
  <link rel="stylesheet" href="/home.css" />
  <link rel="stylesheet" href="/kit.css" />
</head>
<body>
<div id="boot">
  <div>
    <div class="word" aria-label="fameboy"><span>f</span><span>a</span><span>m</span><span>e</span><span>b</span><span>o</span><span>y</span></div>
    <div class="edition" id="boot-edition"></div>
    <div class="status" id="boot-status" role="status"></div>
  </div>
</div>

<div id="app">
  <header class="top" data-reveal style="--i:0">
    <span class="hello" id="hello">hello</span>
    <span class="dim" id="when"></span>
    <span class="who" id="who"></span>
  </header>

  <div class="grid">
    <section class="tile span7" data-reveal style="--i:1">
      <h2><span>network conditions</span><span>snapchain</span></h2>
      <div class="body" id="conditions"></div>
    </section>

    <section class="tile span5" data-reveal style="--i:2">
      <h2><span id="since-title">since you last checked in</span><span id="since-ago"></span></h2>
      <div class="body" id="since"><span class="dim">looking<span class="blink">_</span></span></div>
    </section>

    <section class="tile span7 node" data-reveal style="--i:3">
      <h2><span>this node</span><span id="host"></span></h2>
      <div class="body" id="node"></div>
    </section>

    <section class="tile span5" data-reveal style="--i:4">
      <h2><span>on this node</span><span id="online-n"></span></h2>
      <div class="body" id="presence"><span class="dim">looking<span class="blink">_</span></span></div>
    </section>
  </div>
</div>

<nav class="bar" aria-label="Modes" data-reveal style="--i:5" data-modes="home">
  <div class="in">
    <span class="hint"><kbd>←</kbd><kbd>→</kbd> <kbd>↵</kbd> go · <kbd>o</kbd> offline · <kbd>m</kbd> sound <span id="snd">on</span> · <span id="pad">no controller</span></span>
  </div>
</nav>

<div class="scrim" id="followers" hidden>
  <section class="tile modal" role="dialog" aria-modal="true" aria-label="New followers">
    <h2><span>new followers</span><span><span id="fol-count"></span> · <button id="fol-close" style="all:unset;cursor:pointer">close ×</button></span></h2>
    <div class="inner" id="fol-body"></div>
  </section>
  <div class="hc" id="fol-hc" role="tooltip"></div>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="/mine.js"></script>
<script src="/kit.js"></script>
<script src="/home.js"></script>
</body>
</html>
